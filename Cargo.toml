[package]
name = "kube-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
eframe = "0.33.3"
egui-phosphor = "0.11"
egui_extras = "0.33.3"
futures = "0.3.34"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "tls12", "logging"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
image = { version = "0.25", default-features = false, features = ["png"] }
k8s-openapi = { version = "0.29.0", features = ["latest"] }
kube = { version = "5.0.0", features = ["ws", "client", "rustls-tls", "runtime"] }
rfd = "0.17.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
tokio = { version = "1.54.1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
vt100 = "0.18.1"
